<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070b" />
    <title>PureBeat · MSC 2026</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#06070b;color:#e4e4e7}
      .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .boot__card{max-width:520px;text-align:center}.boot__pulse{width:42px;height:42px;margin:0 auto 20px;border:3px solid #27272a;border-top-color:#67e8f9;border-radius:50%;animation:spin .8s linear infinite}
      .boot__title{font-size:22px;font-weight:800}.boot__hint{margin-top:10px;color:#a1a1aa;line-height:1.7}.boot__actions{display:none;margin-top:22px}.boot--slow .boot__actions{display:block}.boot__button{display:inline-block;border:1px solid #52525b;background:#18181b;color:#fff;padding:11px 18px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      // Vite 在发布切换后发现旧哈希模块失效时会触发此事件。
      // 使用带时间戳的入口地址自动绕过旧 HTML/CDN 缓存，且限制为 15 秒内一次。
      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        var key = 'purebeat:preload-recovery-at';
        var now = Date.now();
        var previous = Number(sessionStorage.getItem(key) || 0);
        if (now - previous < 15000) return;
        sessionStorage.setItem(key, String(now));
        var target = new URL(window.location.href);
        target.searchParams.set('__recover', String(now));
        window.location.replace(target.toString());
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" class="boot" role="status" aria-live="polite">
        <div class="boot__card">
          <div class="boot__pulse"></div>
          <div class="boot__title">正在进入 PureBeat</div>
          <div class="boot__hint" id="boot-hint">首次加载可能需要几秒钟</div>
          <div class="boot__actions"><button class="boot__button" type="button" onclick="location.reload()">重新加载</button></div>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var boot = document.getElementById('boot-screen');
        if (!boot) return;
        boot.classList.add('boot--slow');
        document.getElementById('boot-hint').textContent = navigator.onLine
          ? '网络响应较慢，可以继续等待或重新加载。'
          : '当前设备已离线，请恢复网络后重新加载。';
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
